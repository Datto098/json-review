<!doctype html>
<html lang="vi">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Campaign Overlap Viewer</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap"
			rel="stylesheet"
		/>
		<style>
			:root {
				--bg: #fff9f4;
				--panel: rgba(255, 255, 255, 0.88);
				--ink: #2b1f1a;
				--muted: #866b5f;
				--line: rgba(143, 90, 60, 0.2);
				--hot: #ff6a3d;
				--hot-strong: #e85020;
				--ok: #0e9f6e;
				--chip: #ffe7dd;
				--shadow: 0 18px 45px rgba(120, 70, 40, 0.15);
			}

			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			body {
				font-family: 'Be Vietnam Pro', sans-serif;
				color: var(--ink);
				min-height: 100vh;
				background:
					radial-gradient(
						circle at 12% 10%,
						rgba(255, 128, 88, 0.28) 0%,
						transparent 35%
					),
					radial-gradient(
						circle at 88% 8%,
						rgba(254, 205, 154, 0.55) 0%,
						transparent 30%
					),
					radial-gradient(
						circle at 50% 95%,
						rgba(255, 196, 140, 0.45) 0%,
						transparent 45%
					),
					var(--bg);
				padding: 28px;
			}

			.wrap {
				max-width: 1450px;
				margin: 0 auto;
				display: grid;
				gap: 18px;
			}

			.hero {
				background: linear-gradient(
					135deg,
					rgba(255, 255, 255, 0.92),
					rgba(255, 240, 228, 0.9)
				);
				border: 1px solid var(--line);
				border-radius: 20px;
				box-shadow: var(--shadow);
				padding: 22px;
				display: grid;
				gap: 16px;
				animation: rise 0.45s ease-out;
			}

			.hero-top {
				display: flex;
				justify-content: space-between;
				align-items: center;
				gap: 16px;
				flex-wrap: wrap;
			}

			.title {
				display: flex;
				align-items: center;
				gap: 12px;
			}

			.mark {
				width: 42px;
				height: 42px;
				border-radius: 12px;
				background: linear-gradient(130deg, var(--hot), #ff8b4d);
				box-shadow: 0 8px 20px rgba(255, 106, 61, 0.35);
				display: grid;
				place-items: center;
				color: white;
				font-weight: 800;
				font-family: 'Space Grotesk', sans-serif;
			}

			h1 {
				font-family: 'Space Grotesk', sans-serif;
				font-size: 1.6rem;
				line-height: 1.1;
			}

			.sub {
				color: var(--muted);
				font-size: 0.93rem;
				margin-top: 4px;
			}

			.actions {
				display: flex;
				gap: 10px;
				flex-wrap: wrap;
			}

			.btn {
				border: none;
				border-radius: 12px;
				padding: 10px 14px;
				font-weight: 600;
				font-family: inherit;
				cursor: pointer;
				transition: 0.22s ease;
			}

			.btn-main {
				background: var(--hot);
				color: #fff;
				box-shadow: 0 8px 18px rgba(255, 106, 61, 0.32);
			}

			.btn-main:hover {
				transform: translateY(-1px);
				background: var(--hot-strong);
			}

			.btn-soft {
				background: #fff;
				border: 1px solid var(--line);
				color: var(--ink);
			}

			.btn-soft:hover {
				background: #fff4ed;
			}

			.filter-grid {
				display: grid;
				grid-template-columns: 1.8fr 1fr 1fr 1fr;
				gap: 10px;
			}

			.field {
				display: grid;
				gap: 6px;
			}

			.field label {
				font-size: 0.78rem;
				color: var(--muted);
				font-weight: 600;
				text-transform: uppercase;
				letter-spacing: 0.04em;
			}

			.field input,
			.field select {
				border: 1px solid var(--line);
				background: rgba(255, 255, 255, 0.95);
				color: var(--ink);
				border-radius: 11px;
				padding: 10px 12px;
				outline: none;
				font-size: 0.95rem;
			}

			.field input:focus,
			.field select:focus {
				border-color: var(--hot);
				box-shadow: 0 0 0 3px rgba(255, 106, 61, 0.2);
			}

			.stats {
				display: grid;
				grid-template-columns: repeat(5, minmax(0, 1fr));
				gap: 10px;
			}

			.stat {
				border: 1px solid var(--line);
				background: var(--panel);
				border-radius: 14px;
				padding: 12px;
				backdrop-filter: blur(6px);
				animation: rise 0.45s ease-out;
			}

			.stat .k {
				color: var(--muted);
				font-size: 0.78rem;
				text-transform: uppercase;
				font-weight: 700;
				letter-spacing: 0.04em;
			}

			.stat .v {
				margin-top: 8px;
				font-size: 1.35rem;
				font-family: 'Space Grotesk', sans-serif;
				line-height: 1;
			}

			.panel {
				border: 1px solid var(--line);
				background: var(--panel);
				border-radius: 18px;
				box-shadow: var(--shadow);
				overflow: hidden;
				animation: rise 0.55s ease-out;
			}

			.table-wrap {
				overflow: auto;
				max-height: 72vh;
			}

			table {
				width: 100%;
				border-collapse: collapse;
				min-width: 1120px;
				font-size: 0.91rem;
			}

			th,
			td {
				padding: 12px 14px;
				border-bottom: 1px solid rgba(143, 90, 60, 0.14);
				text-align: left;
				vertical-align: top;
			}

			th {
				position: sticky;
				top: 0;
				z-index: 5;
				background: #fff0e7;
				color: #764e3a;
				font-size: 0.8rem;
				text-transform: uppercase;
				letter-spacing: 0.04em;
				cursor: pointer;
				user-select: none;
			}

			tr:hover td {
				background: rgba(255, 247, 240, 0.95);
			}

			.tiny {
				color: var(--muted);
				font-size: 0.8rem;
				margin-top: 2px;
			}

			.main-name {
				font-weight: 600;
				line-height: 1.35;
				max-width: 460px;
			}

			.campaign-bag {
				display: flex;
				flex-wrap: wrap;
				gap: 7px;
				max-width: 460px;
			}

			.chip {
				border: 1px solid #f5c8b7;
				background: var(--chip);
				border-radius: 999px;
				padding: 4px 9px;
				font-size: 0.75rem;
				white-space: nowrap;
			}

			.n {
				font-family: 'Space Grotesk', sans-serif;
				font-weight: 700;
			}

			.count {
				display: inline-block;
				min-width: 40px;
				text-align: center;
				border-radius: 999px;
				padding: 5px 10px;
				font-weight: 700;
				font-family: 'Space Grotesk', sans-serif;
				background: #ffe7dc;
				color: #8d3f21;
			}

			.status {
				margin: 14px;
				color: var(--muted);
				font-size: 0.9rem;
			}

			#fileInput {
				display: none;
			}

			.hidden {
				display: none !important;
			}

			@keyframes rise {
				from {
					opacity: 0;
					transform: translateY(7px);
				}
				to {
					opacity: 1;
					transform: translateY(0);
				}
			}

			@media (max-width: 1040px) {
				body {
					padding: 14px;
				}

				.filter-grid {
					grid-template-columns: 1fr 1fr;
				}

				.stats {
					grid-template-columns: repeat(2, minmax(0, 1fr));
				}
			}

			@media (max-width: 680px) {
				.filter-grid,
				.stats {
					grid-template-columns: 1fr;
				}

				h1 {
					font-size: 1.3rem;
				}
			}
		</style>
	</head>
	<body>
		<main class="wrap">
			<section class="hero">
				<div class="hero-top">
					<div class="title">
						<div class="mark">CM</div>
						<div>
							<h1>SAN PHAM CHAY NHIEU CAMPAIGN</h1>
							<p class="sub">
								Quan sat nhanh overlap campaign theo item, shop,
								loai campaign va ngan sach.
							</p>
						</div>
					</div>
					<div class="actions">
						<button class="btn btn-main" id="loadDefaultBtn">
							Tai camps.json
						</button>
						<button class="btn btn-soft" id="uploadBtn">
							Chon file JSON
						</button>
						<input
							id="fileInput"
							type="file"
							accept="application/json,.json"
						/>
					</div>
				</div>

				<div class="filter-grid">
					<div class="field">
						<label for="q">Tim kiem</label>
						<input
							id="q"
							type="text"
							placeholder="Ten san pham, campaign, item_id, shop_id..."
						/>
					</div>

					<div class="field">
						<label for="shopFilter">Loc shop</label>
						<select id="shopFilter">
							<option value="all">Tat ca shop</option>
						</select>
					</div>

					<div class="field">
						<label for="typeFilter">Loai campaign</label>
						<select id="typeFilter">
							<option value="all">Tat ca loai</option>
						</select>
					</div>

					<div class="field">
						<label for="minRunning">So camp toi thieu</label>
						<select id="minRunning">
							<option value="1">>= 1</option>
							<option value="2" selected>>= 2</option>
							<option value="3">>= 3</option>
							<option value="4">>= 4</option>
						</select>
					</div>
				</div>
			</section>

			<section class="stats" id="stats">
				<article class="stat">
					<div class="k">Tong dong</div>
					<div class="v n" id="sRows">0</div>
				</article>
				<article class="stat">
					<div class="k">Tong shop</div>
					<div class="v n" id="sShops">0</div>
				</article>
				<article class="stat">
					<div class="k">Max running camp</div>
					<div class="v n" id="sMax">0</div>
				</article>
				<article class="stat">
					<div class="k">Avg running camp</div>
					<div class="v n" id="sAvg">0</div>
				</article>
				<article class="stat">
					<div class="k">Tong budget / ngay</div>
					<div class="v n" id="sBudget">0</div>
				</article>
			</section>

			<section class="panel">
				<p class="status" id="status">Dang cho du lieu...</p>
				<div class="table-wrap hidden" id="tableWrap">
					<table>
						<thead>
							<tr>
								<th data-sort="shop_id">Shop</th>
								<th data-sort="item_id">Item</th>
								<th data-sort="item_name">San pham</th>
								<th data-sort="model_sku_sample">SKU</th>
								<th data-sort="running_campaign_count">
									Running
								</th>
								<th>Campaigns</th>
							</tr>
						</thead>
						<tbody id="tbody"></tbody>
					</table>
				</div>
			</section>
		</main>

		<script>
			const state = {
				rows: [],
				filtered: [],
				shopNames: {},
				sortKey: 'running_campaign_count',
				sortDir: 'desc',
			};

			const els = {
				q: document.getElementById('q'),
				shopFilter: document.getElementById('shopFilter'),
				typeFilter: document.getElementById('typeFilter'),
				minRunning: document.getElementById('minRunning'),
				tbody: document.getElementById('tbody'),
				status: document.getElementById('status'),
				tableWrap: document.getElementById('tableWrap'),
				fileInput: document.getElementById('fileInput'),
				uploadBtn: document.getElementById('uploadBtn'),
				loadDefaultBtn: document.getElementById('loadDefaultBtn'),
				sRows: document.getElementById('sRows'),
				sShops: document.getElementById('sShops'),
				sMax: document.getElementById('sMax'),
				sAvg: document.getElementById('sAvg'),
				sBudget: document.getElementById('sBudget'),
			};

			function formatNumber(n) {
				return Number(n || 0).toLocaleString('vi-VN');
			}

			function formatVnd(v) {
				return Number(v || 0).toLocaleString('vi-VN') + ' VND';
			}

			function normalize(input) {
				return String(input || '')
					.toLowerCase()
					.normalize('NFD')
					.replace(/[\u0300-\u036f]/g, '');
			}

			function safe(value, fallback = 'N/A') {
				if (value === null || value === undefined || value === '') {
					return fallback;
				}
				return value;
			}

			function getShopDisplay(shopId) {
				const key = String(shopId);
				return state.shopNames[key] || key;
			}

			function getAllCampaignTypes(rows) {
				const set = new Set();
				rows.forEach((row) => {
					(row.campaigns || []).forEach((c) =>
						set.add(c.type || 'unknown')
					);
				});
				return Array.from(set).sort();
			}

			function getAllShops(rows) {
				const set = new Set(rows.map((row) => String(row.shop_id)));
				return Array.from(set).sort((a, b) => Number(a) - Number(b));
			}

			function fillSelect(selectEl, values, defaultLabel, getLabel) {
				selectEl.innerHTML = '';
				const allOption = document.createElement('option');
				allOption.value = 'all';
				allOption.textContent = defaultLabel;
				selectEl.appendChild(allOption);

				values.forEach((value) => {
					const option = document.createElement('option');
					option.value = value;
					option.textContent = getLabel ? getLabel(value) : value;
					selectEl.appendChild(option);
				});
			}

			function setStatus(message) {
				els.status.textContent = message;
			}

			function updateStats(data) {
				const shopSet = new Set(data.map((row) => row.shop_id));
				const maxRunning = data.reduce(
					(max, row) =>
						Math.max(max, Number(row.running_campaign_count || 0)),
					0
				);
				const avgRunning = data.length
					? data.reduce(
							(sum, row) =>
								sum + Number(row.running_campaign_count || 0),
							0
						) / data.length
					: 0;

				const totalBudget = data.reduce((sum, row) => {
					const rowBudget = (row.campaigns || []).reduce(
						(s, c) => s + Number(c.daily_budget || 0),
						0
					);
					return sum + rowBudget;
				}, 0);

				els.sRows.textContent = formatNumber(data.length);
				els.sShops.textContent = formatNumber(shopSet.size);
				els.sMax.textContent = formatNumber(maxRunning);
				els.sAvg.textContent = avgRunning.toFixed(2);
				els.sBudget.textContent = formatVnd(totalBudget);
			}

			function compareValues(a, b, key, dir) {
				const factor = dir === 'asc' ? 1 : -1;
				const va = a[key];
				const vb = b[key];

				if (
					key === 'running_campaign_count' ||
					key === 'shop_id' ||
					key === 'item_id'
				) {
					return (Number(va || 0) - Number(vb || 0)) * factor;
				}

				return (
					String(va || '').localeCompare(String(vb || ''), 'vi') *
					factor
				);
			}

			function applyFilters() {
				const q = normalize(els.q.value.trim());
				const shopValue = els.shopFilter.value;
				const typeValue = els.typeFilter.value;
				const minRunning = Number(els.minRunning.value || 1);

				state.filtered = state.rows.filter((row) => {
					const running = Number(row.running_campaign_count || 0);
					if (running < minRunning) return false;

					if (
						shopValue !== 'all' &&
						String(row.shop_id) !== shopValue
					) {
						return false;
					}

					if (typeValue !== 'all') {
						const hasType = (row.campaigns || []).some(
							(c) => (c.type || '') === typeValue
						);
						if (!hasType) return false;
					}

					if (!q) return true;

					const rowText = [
						row.shop_id,
						getShopDisplay(row.shop_id),
						row.item_id,
						row.item_name,
						row.model_sku_sample,
						...(row.campaigns || []).map((c) => c.campaign_name),
						...(row.campaigns || []).map((c) => c.type),
					]
						.map(normalize)
						.join(' ');

					return rowText.includes(q);
				});

				state.filtered.sort((a, b) =>
					compareValues(a, b, state.sortKey, state.sortDir)
				);
				renderRows();
				updateStats(state.filtered);

				setStatus(
					'Hien thi ' +
						formatNumber(state.filtered.length) +
						' / ' +
						formatNumber(state.rows.length) +
						' dong'
				);
			}

			function renderRows() {
				els.tbody.innerHTML = '';

				if (!state.filtered.length) {
					const tr = document.createElement('tr');
					tr.innerHTML =
						'<td colspan="6" style="padding:18px;color:#866b5f;">Khong co du lieu trung voi dieu kien loc.</td>';
					els.tbody.appendChild(tr);
					return;
				}

				state.filtered.forEach((row) => {
					const tr = document.createElement('tr');

					const campaigns = (row.campaigns || []).map((c) => {
						const label = [
							c.type || 'unknown',
							c.status || '-',
							formatVnd(c.daily_budget),
						].join(' | ');
						return (
							'<span class="chip" title="' +
							String(c.campaign_name || '') +
							'">' +
							label +
							'</span>'
						);
					});

					tr.innerHTML =
						'<td><div class="n">' +
						safe(getShopDisplay(row.shop_id)) +
						'</div><div class="tiny">' +
						safe(row.shop_id) +
						'</div></td>' +
						'<td><div class="n">' +
						safe(row.item_id) +
						'</div></td>' +
						'<td><div class="main-name">' +
						safe(row.item_name, 'Khong co ten san pham') +
						'</div></td>' +
						'<td><div>' +
						safe(row.model_sku_sample) +
						'</div></td>' +
						'<td><span class="count">' +
						formatNumber(row.running_campaign_count) +
						'</span></td>' +
						'<td><div class="campaign-bag">' +
						campaigns.join('') +
						'</div></td>';

					els.tbody.appendChild(tr);
				});
			}

			function setupSortHeaders() {
				const headers = document.querySelectorAll('th[data-sort]');
				headers.forEach((th) => {
					th.addEventListener('click', () => {
						const key = th.dataset.sort;
						if (!key) return;

						if (state.sortKey === key) {
							state.sortDir =
								state.sortDir === 'asc' ? 'desc' : 'asc';
						} else {
							state.sortKey = key;
							state.sortDir =
								key === 'running_campaign_count'
									? 'desc'
									: 'asc';
						}

						applyFilters();
					});
				});
			}

			function bindControls() {
				[els.q, els.shopFilter, els.typeFilter, els.minRunning].forEach(
					(el) => {
						el.addEventListener('input', applyFilters);
						el.addEventListener('change', applyFilters);
					}
				);

				els.uploadBtn.addEventListener('click', () =>
					els.fileInput.click()
				);

				els.fileInput.addEventListener('change', (event) => {
					const file = event.target.files[0];
					if (!file) return;

					const reader = new FileReader();
					reader.onload = () =>
						loadFromText(reader.result, file.name);
					reader.readAsText(file, 'utf-8');
				});

				els.loadDefaultBtn.addEventListener('click', () =>
					loadDefaultFile()
				);

				window.addEventListener('dragover', (event) =>
					event.preventDefault()
				);
				window.addEventListener('drop', (event) => {
					event.preventDefault();
					const file =
						event.dataTransfer.files && event.dataTransfer.files[0];
					if (!file || !file.name.toLowerCase().endsWith('.json'))
						return;

					const reader = new FileReader();
					reader.onload = () =>
						loadFromText(reader.result, file.name);
					reader.readAsText(file, 'utf-8');
				});
			}

			function prepareData(raw) {
				if (!raw || !Array.isArray(raw.details)) {
					throw new Error('Khong tim thay mang details trong JSON');
				}

				state.shopNames = raw.shop_names || {};

				state.rows = raw.details.map((r) => ({
					shop_id: r.shop_id,
					item_id: r.item_id,
					item_name: r.item_name,
					model_sku_sample: r.model_sku_sample,
					running_campaign_count: Number(
						r.running_campaign_count || 0
					),
					campaigns: Array.isArray(r.campaigns) ? r.campaigns : [],
				}));

				fillSelect(
					els.shopFilter,
					getAllShops(state.rows),
					'Tat ca shop',
					(shopId) => getShopDisplay(shopId)
				);
				fillSelect(
					els.typeFilter,
					getAllCampaignTypes(state.rows),
					'Tat ca loai'
				);

				state.sortKey = 'running_campaign_count';
				state.sortDir = 'desc';
				els.tableWrap.classList.remove('hidden');
				applyFilters();
			}

			function loadFromText(text, sourceName) {
				try {
					const parsed = JSON.parse(String(text || ''));
					prepareData(parsed);
					setStatus('Da tai du lieu tu: ' + sourceName);
				} catch (error) {
					setStatus('Loi doc JSON: ' + error.message);
				}
			}

			async function loadDefaultFile() {
				setStatus('Dang tai camps.json...');
				try {
					const response = await fetch('camps.json', {
						cache: 'no-store',
					});
					if (!response.ok) {
						throw new Error('Khong mo duoc camps.json');
					}

					const text = await response.text();
					loadFromText(text, 'camps.json');
				} catch (error) {
					setStatus('Khong the tai file mac dinh: ' + error.message);
				}
			}

			setupSortHeaders();
			bindControls();
			loadDefaultFile();
		</script>
	</body>
</html>
